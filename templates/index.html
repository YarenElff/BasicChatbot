<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Application</title>

    <style>
      body {
        font-family: monospace;
      }

      #chatBox {
        margin-left: auto;
        margin-right: auto;
        width: 40%;
        margin-top: 50px;
      }
      .botText {
        font-family: monospace;
        font-size: 16px;
        text-align: left;
        line-height: 25px;
        color: blue;
      }
      #userInput {
        margin-left: auto;
        margin-right: auto;
        width: 80%;
        text-align: center;
        margin-top: 50px;
      }
      #textInput {
        border-bottom: 3px solid grey;
        font-family: monospace;
        font-size: 16px;
      }
      #buttonInput {
        padding: 5px;
        font-family: monospace;
        font-size: 16px;
      }
      h1 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>ChatBot App</h1>
    <div id="chatBox">
      <p class="botText"><span> Hi there ! </span></p>
    </div>

    <div id="userInput">
      <input
        id="textInput"
        type="text"
        name="userMessage"
        placeholder="Type your message here..."
      />
      <input id="buttonInput" type="submit" value="Send" />
    </div>
  </body>
</html>
