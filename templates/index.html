<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Application</title>

    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        font-family: monospace;
        color: #30364f;
        background-color: #f0f0db;
      }

      #chatBox {
        margin-left: auto;
        margin-right: auto;
        width: 80%;
        margin-top: 50px;
      }
      .botText {
        font-family: monospace;
        font-size: 16px;
        text-align: left;
        line-height: 25px;
        color: #30364f;
      }
      #userInput {
        margin-left: auto;
        margin-right: auto;
        width: 80%;
        text-align: center;
        margin-top: 50px;
      }
      #textInput {
        border: 3px solid #acbac4;
        border-radius: 10px;
        /*border-bottom: 3px solid #30364f;*/
        font-family: monospace;
        font-size: 16px;
        width: 80%;
        padding: 5px;
        background-color: #acbac4;
        color: #30364f;
      }
      #buttonInput {
        padding: 5px;
        border-radius: 10px;
        background-color: #acbac4;
        color: #30364f;
        font-family: monospace;
        font-size: 16px;
      }
      h1 {
        text-align: center;
      }
      .userText {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>ChatBot App</h1>
    <div>
      <div id="chatBox">
        <p class="botText"><span> Hi there ! </span></p>
      </div>

      <div id="userInput">
        <input
          id="textInput"
          type="text"
          name="userMessage"
          placeholder="Type your message here..."
        />
        <input id="buttonInput" type="submit" value="Send" />
      </div>
    </div>

    <script>
      function getUserResponse() {
        var userText = $("#textInput").val();
        var userHTML =
          "<p class='userText'> User : <span>" + userText + "</span></p>";
        $("#textInput").val("");
        $("#chatBox").append(userHTML);
        document
          .getElementById("userInput")
          .scrollIntoView((block = "start"), (behavior = "smooth"));
        $.get("/get", { userMessage: userText }).done(function (data) {
          var botHTML =
            "<p class='botText'> ChatBot : <span>" + data + "</span></p>";
          $("#chatBox").append(botHTML);
        });
      }

      $("#textInput").keypress(function (e) {
        if (e.which == 13) {
          getUserResponse();
        }
      });

      $("#buttonInput").click(function () {
        getUserResponse();
      });
    </script>
  </body>
</html>
